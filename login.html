<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sweet & Sour · Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
        .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.85rem; }
        .form-options a { color: var(--primary-blue); font-weight: 500; }
        .form-options a:hover { text-decoration: underline; }
        .auth-card .brand h2 span { color: var(--primary-blue); }
    </style>
<link rel="preconnect" href="https://wsrv.nl" crossorigin>
<link rel="preconnect" href="https://i.ibb.co" crossorigin>
<script src="img-optimizer.js"></script>
<style>.privacy-check{display:flex;align-items:flex-start;gap:8px;margin:0 0 1rem;font-size:.8rem;line-height:1.5;color:#555;cursor:pointer}.privacy-check input{margin-top:3px;width:17px;height:17px;flex-shrink:0;accent-color:#245;cursor:pointer}.privacy-check a{color:#245;text-decoration:underline}.privacy-check.error{color:#b91c1c}.privacy-check.error input{outline:2px solid #b91c1c;outline-offset:1px}</style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="brand">
                <img src="logo.png" alt="Sweet & Sour" class="logo" onerror="this.style.display='none'" />
                <h2>Sweet <span>&amp;</span> Sour</h2>
                <p>Welcome back!</p>
            </div>

            <form id="loginForm">
                <div class="form-group"><label for="email">Email Address</label><input type="email" id="email" placeholder="your@email.com" required /></div>
                <div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="••••••••" required /></div>
                <div class="form-options">
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:0.8rem;"><input type="checkbox" id="rememberMe" /> Remember me</label>
                    <a href="forgot-password.html">Forgot password?</a>
                </div>
                <label class="privacy-check" id="privacyCheckWrap"><input type="checkbox" id="privacyCheck" /> <span>I have read and agree to the <a href="privacy-policy.html" target="_blank" rel="noopener">Privacy Policy</a> and consent to Sweet &amp; Sour using my details to process my account and orders.</span></label>
                <button type="submit" class="auth-btn" id="loginBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">Sign In</span>
                </button>
            </form>

            <div class="divider">or continue with</div>

            <button class="btn-google" id="googleLoginBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
                Continue with Google
            </button>

            <div class="auth-footer">Don't have an account? <a href="signup.html">Create Account</a></div>
        </div>
    </div>

    <div class="toast-container" id="toast"></div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, doc, getDoc, setDoc, updateDoc, Timestamp } from 'firebase/firestore';

        const firebaseConfig = {
            apiKey: "AIzaSyAfGWLLJ-bmMrbkhLkdwhxIo2QrW7mYKQA",
            authDomain: "sweet-and-sour-aa364.firebaseapp.com",
            projectId: "sweet-and-sour-aa364",
            storageBucket: "sweet-and-sour-aa364.firebasestorage.app",
            messagingSenderId: "1046434031562",
            appId: "1:1046434031562:web:b325998964afbfe4105133"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const toast = document.getElementById('toast');
        const googleBtn = document.getElementById('googleLoginBtn');
        let toastTimer = null;

        function showToast(message, type = 'error') {
            toast.textContent = message;
            toast.className = `toast-container ${type}`;
            toast.style.display = 'block';
            requestAnimationFrame(() => toast.classList.add('show'));
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.style.display = 'none', 400); }, 3000);
        }

        function setLoading(loading) {
            if (loading) { loginBtn.classList.add('btn-loading'); loginBtn.disabled = true; }
            else { loginBtn.classList.remove('btn-loading'); loginBtn.disabled = false; }
        }

        function privacyOk() {
            const c = document.getElementById('privacyCheck');
            const w = document.getElementById('privacyCheckWrap');
            if (!c.checked) { w.classList.add('error'); showToast('Please accept the Privacy Policy to continue', 'error'); c.focus(); return false; }
            w.classList.remove('error'); return true;
        }
        document.getElementById('privacyCheck').addEventListener('change', () => document.getElementById('privacyCheckWrap').classList.remove('error'));

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!privacyOk()) return;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) { showToast('Please fill in all fields', 'error'); return; }
            setLoading(true);
            try {
                await signInWithEmailAndPassword(auth, email, password);
                showToast('Login successful!', 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 800);
            } catch (error) {
                let message = 'Login failed. Please try again.';
                if (error.code === 'auth/user-not-found') message = 'No account found with this email.';
                else if (error.code === 'auth/wrong-password') message = 'Incorrect password.';
                else if (error.code === 'auth/invalid-email') message = 'Invalid email address.';
                else if (error.code === 'auth/too-many-requests') message = 'Too many failed attempts. Please try again later.';
                else if (error.code === 'auth/network-request-failed') message = 'Network error. Please check your connection.';
                showToast(message, 'error');
                setLoading(false);
            }
        });

        googleBtn.addEventListener('click', async () => {
            if (!privacyOk()) return;
            googleBtn.disabled = true;
            googleBtn.style.opacity = '0.6';
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                const userDocRef = doc(db, 'users', user.uid);
                const userDoc = await getDoc(userDocRef);
                if (!userDoc.exists()) {
                    await setDoc(userDocRef, {
                        uid: user.uid,
                        email: user.email,
                        name: user.displayName || user.email?.split('@')[0] || 'User',
                        firstName: user.displayName?.split(' ')[0] || '',
                        lastName: user.displayName?.split(' ').slice(1).join(' ') || '',
                        phone: user.phoneNumber || '',
                        role: 'customer',
                        status: 'active',
                        createdAt: Timestamp.now(),
                        updatedAt: Timestamp.now()
                    });
                } else {
                    const existingData = userDoc.data();
                    await updateDoc(userDocRef, {
                        name: user.displayName || existingData.name || user.email?.split('@')[0] || 'User',
                        email: user.email,
                        phone: user.phoneNumber || existingData.phone || '',
                        updatedAt: Timestamp.now()
                    });
                }
                showToast('Google sign in successful!', 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 800);
            } catch (error) {
                let message = 'Google sign in failed. Please try again.';
                if (error.code === 'auth/popup-closed-by-user') message = 'Sign in popup was closed.';
                else if (error.code === 'auth/popup-blocked') message = 'Sign in popup was blocked.';
                else if (error.code === 'auth/account-exists-with-different-credential') message = 'An account already exists with this email.';
                showToast(message, 'error');
            } finally {
                googleBtn.disabled = false;
                googleBtn.style.opacity = '1';
            }
        });

        onAuthStateChanged(auth, (user) => { if (user) window.location.href = 'index.html'; });
    </script>
